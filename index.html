<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birdify — Catálogo de Aves</title>
  <meta name="description" content="Birdify: catálogo de aves y bitácora de avistamientos que funciona sin conexión." />
  <!-- Favicon vacío: evita una petición extra a /favicon.ico (404 en línea, 503 sin red) -->
  <link rel="icon" href="data:," />

  <!-- Script para recibir redirección de 404.html en GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <!--
    Separación App Shell / Contenido:
    hell.css que estilos estructurales permanentes como header, nav, footer y #app
    home.css que son estilos específicos de la vista Inicio osea el grid de tarjetas
    detail.css son estilos específicos de la vista de detalle
  -->
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/sightings.css" />
  <link rel="stylesheet" href="styles/detail.css" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/diagnostic.css" />
</head>

<body>

  <!-- app shell que se mantiene en toda la vida de la SPA nunca se reemplaza -->
  <header>
    <h1>Birdify</h1>
    <nav>
      <a href="/" data-link>Inicio</a>
      <a href="/acerca" data-link>Nosotros</a>
      <a href="/avistamientos" data-link>Avistamientos</a>
      <a href="/diagnostico" data-link>Diagnóstico</a>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">🌙</button>
      <!-- Insignia de conectividad (la controla src/pwa/networkStatus.js) -->
      <span id="network-badge" class="network-badge" role="status" aria-live="polite" hidden></span>
    </nav>
  </header>

  <!-- Franja explicativa cuando no hay red o se sirve una copia guardada -->
  <div id="network-banner" class="network-banner" role="status" aria-live="polite" hidden></div>

  <!--
    contendor raiz única zona que el router modifica.
    El skeleton es visible mientras el router resuelve la vista
    el router lo reemplaza con el HTML real de la vista
  -->
  <main id="app">
    <div class="skeleton-loader" aria-label="Cargando contenido…" role="status">
      <div class="skeleton-block title"></div>
      <div class="skeleton-block card"></div>
      <div class="skeleton-block card"></div>
      <div class="skeleton-block card"></div>
    </div>
  </main>

  <!--footer se mantiene en toda la vida de la SPA nunca se reemplaza -->
  <footer>
    <p>Todos los derechos reservados — Birdify</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>

</html>
