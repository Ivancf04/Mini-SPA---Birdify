<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Birdify — Cargando...</title>
  <link rel="manifest" href="/Mini-SPA---Birdify/manifest.json">
  <meta name="theme-color" content="#018547">
  <link rel="icon" type="image/png" sizes="32x32" href="/Mini-SPA---Birdify/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/Mini-SPA---Birdify/icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Birdify">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-startup-image"
        href="/Mini-SPA---Birdify/icons/splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

  <script type="text/javascript">
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
