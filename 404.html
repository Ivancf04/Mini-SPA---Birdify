<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birdify — Catálogo de Aves</title>

  <!--
    Separación App Shell / Contenido:
    shell.css: estilos estructurales permanentes como header, nav, footer y #app
    home.css: estilos específicos de la vista Inicio
    sightings.css: estilos de la bitácora de avistamientos (IndexedDB)
    detail.css: estilos específicos de la vista de detalle
    theme.css: variables y modo oscuro
    diagnostic.css: vista de diagnóstico
  -->
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/sightings.css" />
  <link rel="stylesheet" href="styles/detail.css" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/diagnostic.css" />
</head>

<body>

  <!-- App Shell permanente -->
  <header>
    <h1>Birdify</h1>
    <nav>
      <a href="/" data-link>Inicio</a>
      <a href="/acerca" data-link>Nosotros</a>
      <a href="/avistamientos" data-link>Avistamientos</a>
      <a href="/diagnostico" data-link>Diagnóstico</a>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">🌙</button>
    </nav>
  </header>

  <!-- Contenedor raíz dinámico -->
  <main id="app">
    <div class="skeleton-loader" aria-label="Cargando contenido…" role="status">
      <div class="skeleton-block title"></div>
      <div class="skeleton-block card"></div>
      <div class="skeleton-block card"></div>
      <div class="skeleton-block card"></div>
    </div>
  </main>

  <!-- Footer permanente -->
  <footer>
    <p>Todos los derechos reservados — Birdify</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>

</html>
