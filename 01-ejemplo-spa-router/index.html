<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo SPA - Módulos ES6 + History API</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header>
    <h1>Demo SPA</h1>
    <!-- data-link es la marca que usaremos para interceptar los clics -->
    <nav>
      <a href="/" data-link>Inicio</a>
      <a href="/acerca" data-link>Acerca de</a>
      <a href="/contacto" data-link>Contacto</a>
      <a href="/ruta-inexistente" data-link>Ruta inválida (demo 404)</a>
    </nav>
  </header>

  <!-- El router siempre renderiza dentro de este contenedor -->
  <main id="app">Cargando...</main>

  <footer>
    <p>La URL cambia, pero el documento nunca se recarga. Observa la pestaña Network.</p>
  </footer>

  <!-- type="module" habilita import/export en este archivo y en los que importe -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
